# Sillo capability inventory.
#
# The maintained map of Sillo's public surface, and the denominator of
# `sillo-agent skills coverage`. It is checked from both sides in CI:
#
#   - `npm run coverage:gaps` diffs it against the surface snapshots in
#     framework/surface/: a public module that no capability (or `internal`
#     entry) owns fails the build, so a new Sillo subsystem cannot ship
#     without the agent noticing.
#   - `npm run validate` requires every `present` + `required` capability to
#     be claimed by at least one stable skill (via the skill's `capabilities:`
#     frontmatter), and every `absent` capability to be claimed by the base
#     `sillo` skill, which tells agents not to invent it.
#
# status:
#   present   Sillo has it. A skill must teach it.
#   absent    Sillo deliberately does not have it; agents keep inventing it.
#             `guidance` says what to do instead.
#   internal  Public by name only; no guidance owed.
#
# modules: Python module prefixes this capability owns. `x.y` owns x.y and
# everything below it; `x.y$` owns exactly x.y (for re-export hubs).

schema: 1
framework: sillo
tracks: ">=1.0.0 <2.0.0"

