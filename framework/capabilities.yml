  # ── Not in Sillo ─────────────────────────────────────────────────────────
  # Features developers ask for by name that Sillo 1.x does not have. The base
  # skill lists each one so an agent says so instead of inventing an import.
  - id: distributed_locks
    title: Distributed locks
    area: Not in Sillo
    status: absent
    guidance: >-
      There is no sillo.locks module or lock primitive. For "run once across
      processes", use Redis directly (SET key value NX EX ttl via redis-py);
      a scheduled job's max_instances only prevents overlap inside one process.

  - id: telemetry
    title: Metrics & tracing (OpenTelemetry)
    area: Not in Sillo
    status: absent
    guidance: >-
      Sillo 1.x ships request IDs and logging, not metrics or tracing. Add an
      OpenTelemetry ASGI middleware with app.use(..., raw=True), or record
      timings in your own middleware. sillo-graphql alone has an opentelemetry hook.

  - id: html_templating
    title: Server-side HTML templating
    area: Not in Sillo
    status: absent
    guidance: >-
      The v0.x templating layer was removed in 1.0; Jinja2 is only used for
      email bodies (sillo-framework[mail]). Use sillo-inertia for pages, return
      html(...) for small responses, or keep your own Jinja2 Environment.

  - id: notifications
    title: Multi-channel notifications
    area: Not in Sillo
    status: absent
    guidance: >-
      There is no notification system. Compose it: sillo.mail for email,
      sillo-wire rooms for in-app delivery, and a queued Job to send them
      without blocking the request.

  - id: localization
    title: Translations & localization
    area: Not in Sillo
    status: absent
    guidance: >-
      Sillo parses Accept-Language (sillo.http.accepts) but has no translation
      catalogs or gettext integration; use Babel or your own lookup keyed on
      the negotiated language.

  - id: queue_brokers
    title: Non-Redis queue brokers (SQS, RabbitMQ, Kafka)
    area: Not in Sillo
    status: absent
    guidance: >-
      Sillo's queue connections are SyncConnection (in-process) and
      RedisConnection. For another broker, subclass
      sillo.work.queue.QueueConnection (push/pop/ack/fail/size/clear).

